[package]
name = "data-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.16.1"
serde = { version="1.0" }
postcard = { version = "1.1", features = ["alloc"] }
simple_crypt = { version = "0.2" }
ron = { version = "0.12" }
anyhow = { version = "1.0" }
xxhash-rust = {version = "0.8.15", default-features = false, features = ["xxh3"] }

[build-dependencies]
slint-build = "1.16.1"

[profile.release]
codegen-units = 1
lto = true
